<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Claude 교육 자료 - 코리안리</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
  :root{
    --bg:#F2F4F6;
    --ink:#10233F;
    --body:#3C4652;
    --muted:#8996A6;
    --line:#D9E0E6;
    --accent:#2E7C6C;
    --accent-ink:#1C4E44;
    --mono:'JetBrains Mono', ui-monospace, monospace;
    --sans:'Pretendard', -apple-system, 'Malgun Gothic', sans-serif;
  }
  *,*::before,*::after{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; height:100%; }
  body{
    font-family:var(--sans);
    background:var(--bg);
    color:var(--ink);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    padding:8vh 6vw;
    word-break:keep-all;
    opacity:1;
    transition:opacity .28s ease;
  }
  body.leaving{ opacity:0; }

  .eyebrow{
    font-family:var(--mono);
    font-size:.78rem;
    letter-spacing:.14em;
    color:var(--accent-ink);
    text-transform:uppercase;
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:22px;
  }
  .eyebrow::before{ content:""; width:22px; height:1px; background:var(--accent); }

  h1{
    font-size:clamp(1.6rem,3vw,2.3rem);
    font-weight:800;
    letter-spacing:-0.01em;
    margin:0 0 44px;
    text-align:center;
  }

  .buttons{
    display:flex;
    align-items:stretch;
    justify-content:center;
    gap:28px;
    flex-wrap:wrap;
  }
  .btn{
    display:flex;
    flex-direction:column;
    justify-content:center;
    gap:6px;
    width:250px;
    padding:26px 24px;
    background:#fff;
    border:1px solid var(--line);
    border-radius:14px;
    text-decoration:none;
    color:var(--ink);
    box-shadow:0 1px 2px rgba(16,35,63,.04);
    transition:transform .18s ease, border-color .18s ease, box-shadow .18s ease;
  }
  .btn:hover{
    transform:translateY(-4px);
    border-color:var(--accent);
    box-shadow:0 12px 24px rgba(16,35,63,.1);
  }
  .btn:active{ transform:translateY(-1px); }
  .btn .tag{
    font-family:var(--mono);
    font-size:.68rem;
    letter-spacing:.1em;
    color:var(--accent);
    text-transform:uppercase;
  }
  .btn .title{
    font-size:1.05rem;
    font-weight:700;
  }

  .brandline{
    margin-top:9vh;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:14px;
    font-family:var(--mono);
    font-size:.7rem;
    letter-spacing:.08em;
    color:var(--muted);
    text-transform:uppercase;
  }
  .brandline .x{ color:var(--line); font-size:.6rem; }

  @media (max-width:560px){
    .buttons{ flex-direction:column; align-items:center; }
    .btn{ width:100%; max-width:280px; }
  }
</style>
</head>
<body>
<div class="eyebrow">Claude 교육 자료</div>
<h1>실습 자료를 선택하세요</h1>

<div class="buttons">
  <a class="btn" href="Claude_cowork_KoreanRe.html">
    <span class="tag">Slides</span>
    <span class="title">Claude Cowork - 코리안리</span>
  </a>
  <a class="btn" href="코리안리_Cowork_실습가이드.html">
    <span class="tag">Guide</span>
    <span class="title">코리안리 Cowork 실습가이드</span>
  </a>
</div>

<div class="brandline">
  <span>Megazone Cloud</span><span class="x">×</span><span>코리안리</span><span class="x">×</span><span>Claude</span>
</div>

<script>
document.querySelectorAll('.btn').forEach(function(link){
  link.addEventListener('click', function(e){
    var href = link.getAttribute('href');
    if(!href || link.target === '_blank') return;
    e.preventDefault();
    document.body.classList.add('leaving');
    setTimeout(function(){ window.location.href = href; }, 260);
  });
});
</script>
</body>
</html>
